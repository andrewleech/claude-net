name: Package claude-net plugin (linux-x64)

# P8 packaging pipeline: version-lockstep gate, single-file artifact build,
# and the packaging-specific smoke test all run on the standard GitHub
# runner. The parity/ceremony harnesses (tests/parity_harness.py,
# tests/ceremony_tests.py) are NOT run here -- see the `host-parity` job
# below for why, and where they do run.

on:
  push:
    branches: ["**"]
    paths:
      - "src/plugin-mpy/**"
      - "src/plugin/plugin.ts"
      - "package.json"
      - ".github/workflows/package-plugin.yml"
  pull_request:
    paths:
      - "src/plugin-mpy/**"
      - "src/plugin/plugin.ts"
      - "package.json"
  workflow_dispatch:

env:
  # Pin the picolet ref this pipeline builds the mcp runtime AND picolet-cli
  # from, to an immutable commit SHA. Bump deliberately, not implicitly via
  # `dev`'s moving HEAD, so a plugin-repo CI run is reproducible independent
  # of concurrent picolet work. This is "runtime: vendor libffi's configure
  # instead of regenerating per-host" -- the runner's cold-cache libffi build
  # was failing on "possibly undefined macro: LT_SYS_SYMBOL_USCORE" even with
  # the right package versions installed (some other automake/aclocal earlier
  # in PATH, not a missing package); this commit sidesteps that by shipping a
  # working configure instead of regenerating one on every runner.
  PICOLET_REF: bd585a8c09d1c738be2eaa0ec7b14dbfb210dd02

jobs:
  version-lockstep:
    # Standalone job (no runtime build needed) so a version mismatch fails
    # fast without waiting on the docker-based runtime build below.
    # `picolet build` also enforces this, via src/plugin-mpy/picolet.toml's
    # [[version_check]] — that's the authoritative check (all three sources,
    # including plugin.ts) and runs regardless of this job; this one exists
    # purely so a mismatch is caught before the docker-based runtime build,
    # not after it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert PLUGIN_VERSION matches across _version.py, package.json, plugin.ts
        run: |
          plugin_version=$(grep -oP '^PLUGIN_VERSION\s*=\s*"\K[^"]+' src/plugin-mpy/_version.py)
          hub_version=$(node -pe "require('./package.json').version")
          ts_version=$(grep -oP 'PLUGIN_VERSION\s*=\s*"\K[^"]+' src/plugin/plugin.ts)
          echo "PLUGIN_VERSION (py)=$plugin_version"
          echo "hub version (package.json)=$hub_version"
          echo "PLUGIN_VERSION (ts)=$ts_version"
          if [ "$plugin_version" != "$hub_version" ] || [ "$plugin_version" != "$ts_version" ]; then
            echo "::error::version lockstep failed: py=$plugin_version json=$hub_version ts=$ts_version"
            exit 1
          fi

  build-mcp-runtime:
    # Prerequisite step (documented, per P8 scope): builds the picolet
    # linux-x64/mcp runtime binary this pipeline packages. This is the
    # only job that touches the picolet tree; it never runs against a
    # runtime this repo's own history controls, and it never checks
    # anything into picolet -- picolet's `dev` branch is out of scope for
    # this workflow beyond reading it.
    runs-on: ubuntu-latest
    needs: version-lockstep
    steps:
      - name: Check out picolet
        uses: actions/checkout@v4
        with:
          repository: andrewleech/picolet
          ref: ${{ env.PICOLET_REF }}
          path: picolet
          # No recursive submodule checkout: the micropython submodule
          # pointer picolet's dev branch records is a rebuild-integration.sh
          # merge commit, local to whichever machine last ran it, never
          # pushed anywhere fetchable -- actions/checkout's direct-commit
          # fetch for it fails outright ("not our ref"). Clone it fresh and
          # recompose the integration branch from mbm.toml instead, below.

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip libtool automake autoconf texinfo
          pip3 install --user mpremote

      - name: Clone micropython submodule fresh
        run: |
          cd picolet/packages/picolet-runtime
          rmdir micropython
          git clone https://github.com/andrewleech/micropython.git micropython

      - name: Rebuild integration branch from mbm.toml
        run: |
          cd picolet/packages/picolet-runtime
          ./scripts/rebuild-integration.sh

      - name: Build linux-x64/mcp runtime
        run: |
          cd picolet/packages/picolet-runtime
          ./scripts/build-runtime.sh --target linux-x64 --variant mcp

      - uses: actions/upload-artifact@v4
        with:
          name: picolet-runtime-linux-x64-mcp
          path: picolet/packages/picolet-runtime/build/picolet-runtime-linux-x64-mcp
          retention-days: 14

  package-and-smoke:
    # Builds the single-file artifact via picolet-cli's own `picolet build`
    # (src/plugin-mpy/picolet.toml drives it: variant = "mcp", [romfs]
    # include/exclude, [[version_check]]) instead of the old bespoke
    # scripts/package-plugin.py, and runs the packaging-specific smoke test
    # (packaged_binary_smoke.py). Does not depend on any host-specific path.
    runs-on: ubuntu-latest
    needs: build-mcp-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Check out picolet-cli
        uses: actions/checkout@v4
        with:
          repository: andrewleech/picolet
          ref: ${{ env.PICOLET_REF }}
          path: picolet
          # Only picolet-cli's own source is needed here; the runtime is
          # already built (previous job) and downloaded below, so no
          # submodule checkout of packages/picolet-runtime is needed.

      - uses: actions/download-artifact@v4
        with:
          name: picolet-runtime-linux-x64-mcp
          path: runtime

      - name: Install picolet-cli's runtime dependency (mpremote)
        run: pip3 install --user mpremote

      - name: Build packaged plugin binary
        env:
          PYTHONPATH: ${{ github.workspace }}/picolet/packages/picolet
        run: |
          chmod +x runtime/picolet-runtime-linux-x64-mcp
          cd src/plugin-mpy
          python3 -m picolet build --target linux-x64 \
            --runtime "$GITHUB_WORKSPACE/runtime/picolet-runtime-linux-x64-mcp" \
            --no-sbom --verbose

      - name: Run packaged-binary smoke test
        run: python3 src/plugin-mpy/tests/packaged_binary_smoke.py src/plugin-mpy/target/linux-x64/claude-net-plugin

      - uses: actions/upload-artifact@v4
        with:
          name: claude-net-plugin-linux-x64
          path: src/plugin-mpy/target/linux-x64/claude-net-plugin
          retention-days: 14

  host-parity:
    # tests/parity_harness.py and tests/ceremony_tests.py are the P7
    # plugin-behaviour gates; they are NOT re-authored here. Both hardcode
    # two host-specific absolute paths that only resolve on Andrew's
    # fleet:
    #   - MPY_BINARY = /home/corona/picolet/packages/picolet-runtime/build/
    #     picolet-runtime-linux-x64-mcp (parity_harness.py)
    #   - NODE_PATH = /home/corona/claude-net/node_modules, the bun
    #     dependency tree of this worktree's *sibling* main-repo checkout
    #     (parity_harness.py's `PluginRunner.start`)
    # A generic GitHub-hosted runner has neither. This job therefore only
    # runs on a self-hosted runner that already mirrors that layout
    # (rebuild picolet's mcp variant to the exact MPY_BINARY path first).
    # Retargeting the harnesses to take these as parameters is a P7
    # test-infrastructure change, out of this round's packaging-only
    # scope.
    runs-on: [self-hosted, claude-net-fleet]
    if: false # enable once a self-hosted runner matching the path layout above is registered
    steps:
      - uses: actions/checkout@v4
      - run: bun install
      - run: python3 src/plugin-mpy/tests/run_all_tests.py
